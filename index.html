<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>My Radio Stations</title>
  
  <!-- iOS PWA Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Radio">
  <meta name="theme-color" content="#12131C">

  <!-- Dynamic Icon & Manifest Placeholders -->
  <link rel="apple-touch-icon" id="apple-icon" sizes="180x180">
  <link rel="icon" id="favicon" type="image/png">
  <link rel="manifest" id="pwa-manifest">

  <!-- Instant Canvas Icon & Web Manifest Generator -->
  <script>
    (function generateInbuiltIcon() {
      const canvas = document.createElement('canvas');
      canvas.width = 180;
      canvas.height = 180;
      const ctx = canvas.getContext('2d');

      const bgGrad = ctx.createLinearGradient(0, 0, 180, 180);
      bgGrad.addColorStop(0, '#1f1d36');
      bgGrad.addColorStop(1, '#0e131f');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 180, 180);

      const circleGrad = ctx.createLinearGradient(20, 20, 160, 160);
      circleGrad.addColorStop(0, '#ff6b6b');
      circleGrad.addColorStop(1, '#ffa502');
      ctx.beginPath();
      ctx.arc(90, 95, 56, 0, Math.PI * 2);
      ctx.fillStyle = circleGrad;
      ctx.fill();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(65, 75);
      ctx.lineTo(48, 50);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(46, 48, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(52, 75, 76, 44, 10);
      } else {
        ctx.rect(52, 75, 76, 44);
      }
      ctx.fill();

      ctx.fillStyle = '#ff6b6b';
      ctx.beginPath();
      ctx.arc(74, 97, 13, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(74, 97, 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffa502';
      ctx.fillRect(96, 86, 22, 5);
      ctx.fillRect(96, 94, 22, 5);
      ctx.fillRect(96, 102, 22, 5);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(90, 95, 68, -Math.PI * 0.75, -Math.PI * 0.25);
      ctx.stroke();

      const iconUrl = canvas.toDataURL('image/png');
      window.generatedAppIcon = iconUrl;

      document.getElementById('apple-icon').href = iconUrl;
      document.getElementById('favicon').href = iconUrl;

      const manifest = {
        name: "My Radio Stations",
        short_name: "Radio",
        start_url: "./",
        display: "standalone",
        background_color: "#12131C",
        theme_color: "#12131C",
        icons: [{ src: iconUrl, sizes: "180x180", type: "image/png" }]
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      document.getElementById('pwa-manifest').href = URL.createObjectURL(blob);
    })();
  </script>

  <!-- HLS Stream Support for .m3u8 feeds -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #ff6b6b;
      --secondary: #ffa502;
      --bg-dark: #12131C;
      --card-bg: rgba(26, 28, 44, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #ffffff;
      --text-muted: #9598b5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1e2038 0%, var(--bg-dark) 100%);
      color: var(--text-main);
      min-height: 100vh;
      padding: max(20px, env(safe-area-inset-top)) 20px max(40px, env(safe-area-inset-bottom)) 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-container {
      width: 100%;
      max-width: 580px;
    }

    .header {
      text-align: center;
      padding: 15px 0 10px 0;
    }

    .header h1 {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    /* Live Equalizer Bars */
    .visualizer {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      height: 38px;
      gap: 4px;
      margin: 15px 0;
    }

    .bar {
      width: 4px;
      height: 4px;
      background: linear-gradient(to top, var(--primary), var(--secondary));
      border-radius: 4px;
      transition: height 0.25s ease;
    }

    .visualizer.active .bar {
      animation: bounce 1.1s ease-in-out infinite alternate;
    }

    @keyframes bounce {
      0% { height: 4px; opacity: 0.3; }
      100% { height: 35px; opacity: 1; }
    }

    /* Player Status Card */
    .now-playing {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px 20px;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      position: relative;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #fff;
      background: rgba(255, 75, 75, 0.25);
      border: 1px solid rgba(255, 75, 75, 0.5);
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
    }

    .live-badge.live .dot {
      background: #ff4757;
      box-shadow: 0 0 8px #ff4757;
      animation: pulse 1.4s infinite;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #888;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .now-playing-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Quick Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 16px 4px;
      background: rgba(255, 255, 255, 0.04);
      padding: 8px 16px;
      border-radius: 14px;
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .volume-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--secondary);
      cursor: pointer;
    }

    .timer-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-muted);
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }

    .timer-btn.active {
      color: var(--secondary);
      border-color: var(--secondary);
    }

    /* Navigation Controls */
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin: 15px 0 22px 0;
    }

    .nav-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: #fff;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.12);
    }

    /* Station List */
    .stations-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .station-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform 0.2s, border 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }

    .station-card:active {
      transform: scale(0.985);
    }

    .station-card.playing {
      border-color: rgba(255, 107, 107, 0.6);
      box-shadow: 0 4px 20px rgba(255, 107, 107, 0.25);
    }

    .station-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      color: #fff;
      flex-shrink: 0;
    }

    .station-info {
      flex: 1;
      min-width: 0;
    }

    .station-name {
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .station-meta {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .play-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border: none;
      color: #fff;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s ease;
    }

    .play-btn.playing {
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
    }

    /* Footer & Credit */
    .developer-credit {
      text-align: center;
      margin-top: 30px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .developer-name {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 14px;
      background: rgba(255, 107, 107, 0.1);
      border-radius: 20px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <audio id="radioPlayer" playsinline webkit-playsinline preload="none"></audio>

  <div class="app-container">
    <div class="header">
      <h1><i class="fas fa-tower-broadcast"></i> My Radio</h1>
      <p>Continuous HD Stream for Mobile & CarPlay</p>
    </div>
    
    <div class="visualizer" id="visualizer"></div>
    
    <div class="now-playing">
      <div class="live-badge" id="liveBadge">
        <span class="dot"></span>
        <span id="statusText">STARTING...</span>
      </div>
      <div class="now-playing-title" id="nowPlayingText">Connecting...</div>
    </div>

    <div class="toolbar">
      <div class="volume-container">
        <i class="fas fa-volume-high" id="volumeIcon" style="font-size: 0.85rem; color: var(--text-muted); cursor:pointer;"></i>
        <input type="range" min="0" max="1" step="0.05" value="1" class="volume-slider" id="volumeSlider" aria-label="Volume">
      </div>
      <button class="timer-btn" id="sleepTimerBtn" aria-label="Sleep Timer">
        <i class="fas fa-moon"></i> <span id="timerLabel">Timer: Off</span>
      </button>
    </div>
    
    <div class="controls">
      <button class="nav-btn" id="prevBtn" aria-label="Previous Station">
        <i class="fas fa-backward-step"></i>
      </button>
      <button class="nav-btn" id="nextBtn" aria-label="Next Station">
        <i class="fas fa-forward-step"></i>
      </button>
    </div>
    
    <div class="stations-container" id="stationsContainer"></div>
    
    <div class="developer-credit">
      <p>Crafted with <i class="fas fa-heart" style="color: #ff6b6b;"></i> for crisp audio</p>
      <div class="developer-name">ROCKY</div>
    </div>
  </div>

  <script>
    const stations = [
      {
        id: 'akashwani-mumbai',
        name: 'Akashwani Mumbai',
        description: 'AIR Mumbai • News, Culture & Live',
        icon: 'fas fa-landmark',
        color: 'linear-gradient(135deg, #0984e3, #74b9ff)',
        streamUrl: 'https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio010/hlspbaudio010_Auto.m3u8'
      },
      {
        id: 'mirchi',
        name: 'Radio Mirchi 98.3 FM',
        description: 'Top Bollywood Charts • Live',
        icon: 'fas fa-fire',
        color: 'linear-gradient(135deg, #ff9800, #ffc107)',
        streamUrl: 'https://eu8.fastcast4u.com/proxy/clyedupq?mp=/1'
      },
      {
        id: 'bigfm',
        name: '92.7 Big FM',
        description: 'Retro & New Bollywood Hits',
        icon: 'fas fa-music',
        color: 'linear-gradient(135deg, #e91e63, #ff6b6b)',
        streamUrl: 'https://stream.zeno.fm/dbstwo3dvhhtv'
      },
      {
        id: 'nasha',
        name: 'Radio Nasha 91.9 FM',
        description: 'Classic Melodies & Fun',
        icon: 'fas fa-compact-disc',
        color: 'linear-gradient(135deg, #00b894, #00cec9)',
        streamUrl: 'https://stream.zeno.fm/zu59ykebs2zuv'
      },
      {
        id: 'ishq',
        name: 'Ishq FM',
        description: 'Romantic Hits & Acoustic Mix',
        icon: 'fas fa-heart',
        color: 'linear-gradient(135deg, #9c27b0, #673ab7)',
        streamUrl: 'https://drive.uber.radio/uber/bollywoodlove/icecast.audio'
      }
    ];

    const audio = document.getElementById('radioPlayer');
    const stationsContainer = document.getElementById('stationsContainer');
    const nowPlayingText = document.getElementById('nowPlayingText');
    const liveBadge = document.getElementById('liveBadge');
    const statusText = document.getElementById('statusText');
    const visualizer = document.getElementById('visualizer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const volumeIcon = document.getElementById('volumeIcon');
    const sleepTimerBtn = document.getElementById('sleepTimerBtn');
    const timerLabel = document.getElementById('timerLabel');

    let currentStation = null;
    let hlsInstance = null;
    let sleepTimeout = null;
    const timerDurations = [0, 15, 30, 45, 60];
    let currentTimerIndex = 0;

    // Visualizer Setup
    for (let i = 0; i < 26; i++) {
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.animationDelay = `${(i * 0.08) % 1.1}s`;
      visualizer.appendChild(bar);
    }

    // Build Station UI
    function renderStations() {
      stationsContainer.innerHTML = '';
      stations.forEach(station => {
        const card = document.createElement('div');
        card.className = 'station-card';
        card.id = `station-${station.id}`;
        card.innerHTML = `
          <div class="station-icon" style="background: ${station.color};">
            <i class="${station.icon}"></i>
          </div>
          <div class="station-info">
            <div class="station-name">${station.name}</div>
            <div class="station-meta">${station.description}</div>
          </div>
          <button class="play-btn" data-id="${station.id}" aria-label="Play ${station.name}">
            <i class="fas fa-play"></i>
          </button>
        `;
        card.addEventListener('click', () => togglePlay(station.id));
        stationsContainer.appendChild(card);
      });
    }
    renderStations();

    // Lockscreen & Control Center Integration
    function updateMediaSession(station) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: station.name,
          artist: station.description,
          album: 'Live Radio',
          artwork: [{ src: window.generatedAppIcon || '', sizes: '180x180', type: 'image/png' }]
        });

        navigator.mediaSession.setActionHandler('play', () => audio.play());
        navigator.mediaSession.setActionHandler('pause', () => audio.pause());
        navigator.mediaSession.setActionHandler('nexttrack', () => changeStation(1));
        navigator.mediaSession.setActionHandler('previoustrack', () => changeStation(-1));
      }
    }

    function setPlaybackState(isPlaying) {
      if (isPlaying) {
        visualizer.classList.add('active');
        liveBadge.classList.add('live');
        statusText.textContent = "ON AIR";
        if (currentStation) updateCardState(currentStation.id, true);
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
      } else {
        visualizer.classList.remove('active');
        liveBadge.classList.remove('live');
        statusText.textContent = "PAUSED";
        if (currentStation) updateCardState(currentStation.id, false);
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
      }
    }

    // Attach stream (supports HLS .m3u8 & regular MP3/AAC)
    function attachStream(url) {
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      if (url.includes('.m3u8')) {
        if (audio.canPlayType('application/vnd.apple.mpegurl')) {
          // Native Safari / iOS HLS
          audio.src = url;
        } else if (Hls.isSupported()) {
          // Android / Chrome / Desktop fallback
          hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
          hlsInstance.loadSource(url);
          hlsInstance.attachMedia(audio);
        } else {
          audio.src = url;
        }
      } else {
        // Standard Shoutcast/Icecast feed
        audio.src = url + (url.includes('?') ? '&' : '?') + 'nocache=' + Date.now();
      }
    }

    function playStation(station) {
      if (currentStation && currentStation.id !== station.id) {
        updateCardState(currentStation.id, false);
      }
      
      currentStation = station;
      highlightStation(station.id);
      
      // Save last played station immediately
      localStorage.setItem('lastPlayedStationId', station.id);

      statusText.textContent = "CONNECTING...";
      nowPlayingText.textContent = station.name;

      attachStream(station.streamUrl);
      audio.load();

      const promise = audio.play();
      if (promise !== undefined) {
        promise.then(() => {
          updateMediaSession(station);
        }).catch(() => {
          // Browser Autoplay Policy caught: Wait for first tap anywhere
          statusText.textContent = "TAP TO RESUME";
          nowPlayingText.textContent = `Tap anywhere to listen to ${station.name}`;
          setPlaybackState(false);

          const startAudioOnFirstTouch = () => {
            audio.play().then(() => {
              updateMediaSession(station);
            });
            window.removeEventListener('click', startAudioOnFirstTouch);
            window.removeEventListener('touchstart', startAudioOnFirstTouch);
          };
          window.addEventListener('click', startAudioOnFirstTouch);
          window.addEventListener('touchstart', startAudioOnFirstTouch);
        });
      }
    }

    function togglePlay(stationId) {
      const station = stations.find(s => s.id === stationId);
      if (!station) return;
      
      if (currentStation && currentStation.id === stationId) {
        if (audio.paused) {
          playStation(station);
        } else {
          audio.pause();
        }
      } else {
        playStation(station);
      }
    }

    function changeStation(step) {
      const currentIndex = currentStation ? stations.findIndex(s => s.id === currentStation.id) : 0;
      let nextIndex = (currentIndex + step + stations.length) % stations.length;
      playStation(stations[nextIndex]);
    }

    function updateCardState(stationId, isPlaying) {
      const btn = document.querySelector(`.station-card#station-${stationId} .play-btn`);
      if (!btn) return;
      const icon = btn.querySelector('i');
      if (isPlaying) {
        btn.classList.add('playing');
        icon.className = 'fas fa-pause';
      } else {
        btn.classList.remove('playing');
        icon.className = 'fas fa-play';
      }
    }

    function highlightStation(stationId) {
      document.querySelectorAll('.station-card').forEach(c => c.classList.remove('playing'));
      const activeCard = document.getElementById(`station-${stationId}`);
      if (activeCard) activeCard.classList.add('playing');
    }

    // Audio Listeners
    audio.addEventListener('playing', () => setPlaybackState(true));
    audio.addEventListener('pause', () => setPlaybackState(false));
    audio.addEventListener('waiting', () => { statusText.textContent = "BUFFERING"; });
    audio.addEventListener('error', () => {
      statusText.textContent = "OFFLINE";
      nowPlayingText.textContent = "Stream temporarily unavailable";
      setPlaybackState(false);
    });

    nextBtn.addEventListener('click', () => changeStation(1));
    prevBtn.addEventListener('click', () => changeStation(-1));

    // Volume Controls
    volumeSlider.addEventListener('input', (e) => {
      audio.volume = e.target.value;
      if (audio.volume === 0) volumeIcon.className = 'fas fa-volume-xmark';
      else if (audio.volume < 0.5) volumeIcon.className = 'fas fa-volume-low';
      else volumeIcon.className = 'fas fa-volume-high';
    });

    volumeIcon.addEventListener('click', () => {
      if (audio.volume > 0) {
        audio.dataset.prevVol = audio.volume;
        audio.volume = 0;
        volumeSlider.value = 0;
        volumeIcon.className = 'fas fa-volume-xmark';
      } else {
        audio.volume = audio.dataset.prevVol || 1;
        volumeSlider.value = audio.volume;
        volumeIcon.className = 'fas fa-volume-high';
      }
    });

    // Sleep Timer
    sleepTimerBtn.addEventListener('click', () => {
      currentTimerIndex = (currentTimerIndex + 1) % timerDurations.length;
      const minutes = timerDurations[currentTimerIndex];

      if (sleepTimeout) clearTimeout(sleepTimeout);

      if (minutes > 0) {
        timerLabel.textContent = `${minutes} min`;
        sleepTimerBtn.classList.add('active');
        sleepTimeout = setTimeout(() => {
          audio.pause();
          timerLabel.textContent = 'Timer: Off';
          sleepTimerBtn.classList.remove('active');
          currentTimerIndex = 0;
        }, minutes * 60 * 1000);
      } else {
        timerLabel.textContent = 'Timer: Off';
        sleepTimerBtn.classList.remove('active');
      }
    });

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        if (currentStation) togglePlay(currentStation.id);
        else playStation(stations[0]);
      } else if (e.code === 'ArrowRight') {
        changeStation(1);
      } else if (e.code === 'ArrowLeft') {
        changeStation(-1);
      } else if (e.code === 'KeyM') {
        volumeIcon.click();
      }
    });

    // AUTOMATIC RESUME ON APP LAUNCH
    window.addEventListener('DOMContentLoaded', () => {
      const savedStationId = localStorage.getItem('lastPlayedStationId');
      const targetStation = stations.find(s => s.id === savedStationId) || stations[0];
      playStation(targetStation);
    });
  </script>
</body>
</html>
