<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>My Radio Stations</title>
  
  <!-- iOS PWA Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Radio">
  <meta name="theme-color" content="#12131C">

  <!-- Dynamic Icon & Manifest Placeholders -->
  <link rel="apple-touch-icon" id="apple-icon" sizes="180x180">
  <link rel="icon" id="favicon" type="image/png">
  <link rel="manifest" id="pwa-manifest">

  <style>
    :root {
      --primary: #ff6b6b;
      --secondary: #ffa502;
      --bg-dark: #12131C;
      --card-bg: rgba(26, 28, 44, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #ffffff;
      --text-muted: #9598b5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1e2038 0%, var(--bg-dark) 100%);
      color: var(--text-main);
      min-height: 100vh;
      padding: max(20px, env(safe-area-inset-top)) 20px max(40px, env(safe-area-inset-bottom)) 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-container {
      width: 100%;
      max-width: 580px;
    }

    .header {
      text-align: center;
      padding: 15px 0 10px 0;
    }

    .header h1 {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .header svg {
      stroke: var(--primary);
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    /* Equalizer Bars */
    .visualizer {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      height: 38px;
      gap: 4px;
      margin: 15px 0;
    }

    .bar {
      width: 4px;
      height: 4px;
      background: linear-gradient(to top, var(--primary), var(--secondary));
      border-radius: 4px;
      transition: height 0.25s ease;
    }

    .visualizer.active .bar {
      animation: bounce 1.1s ease-in-out infinite alternate;
    }

    @keyframes bounce {
      0% { height: 4px; opacity: 0.3; }
      100% { height: 35px; opacity: 1; }
    }

    /* Player Status Card */
    .now-playing {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 18px 20px;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      position: relative;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #fff;
      background: rgba(255, 75, 75, 0.25);
      border: 1px solid rgba(255, 75, 75, 0.5);
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
    }

    .live-badge.live .dot {
      background: #ff4757;
      box-shadow: 0 0 8px #ff4757;
      animation: pulse 1.4s infinite;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #888;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .now-playing-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Navigation Controls */
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      margin: 18px 0 24px 0;
    }

    .nav-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.12);
    }

    /* Station List */
    .stations-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .station-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform 0.2s, border 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }

    .station-card:active {
      transform: scale(0.985);
    }

    .station-card.playing {
      border-color: rgba(255, 107, 107, 0.6);
      box-shadow: 0 4px 20px rgba(255, 107, 107, 0.25);
    }

    .station-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      flex-shrink: 0;
    }

    .station-info {
      flex: 1;
      min-width: 0;
    }

    .station-name {
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .station-meta {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .play-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border: none;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s ease;
    }

    .play-btn.playing {
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
    }

    /* Footer & Credit */
    .developer-credit {
      text-align: center;
      margin-top: 30px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .developer-name {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 14px;
      background: rgba(255, 107, 107, 0.1);
      border-radius: 20px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <audio id="radioPlayer" playsinline webkit-playsinline preload="none"></audio>

  <div class="app-container">
    <div class="header">
      <h1>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.93 4.93a10 10 0 0 1 14.14 0"/><path d="M7.76 7.76a6 6 0 0 1 8.48 0"/><circle cx="12" cy="12" r="2"/><path d="m16 20-4-8-4 8"/><line x1="8" y1="16" x2="16" y2="16"/>
        </svg>
        My Radio
      </h1>
      <p>Continuous HD Stream for Mobile & CarPlay</p>
    </div>
    
    <div class="visualizer" id="visualizer"></div>
    
    <div class="now-playing">
      <div class="live-badge" id="liveBadge">
        <span class="dot"></span>
        <span id="statusText">READY</span>
      </div>
      <div class="now-playing-title" id="nowPlayingText">Select a Station</div>
    </div>
    
    <div class="controls">
      <button class="nav-btn" id="prevBtn" aria-label="Previous Station">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
        </svg>
      </button>
      <button class="nav-btn" id="nextBtn" aria-label="Next Station">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
        </svg>
      </button>
    </div>
    
    <div class="stations-container" id="stationsContainer"></div>
    
    <div class="developer-credit">
      <p>Crafted with 
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#ff6b6b" style="display:inline-block; vertical-align: middle;">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg> 
        for crisp audio
      </p>
      <div class="developer-name">ROCKY</div>
    </div>
  </div>

  <script>
    // Lightweight, fast inline SVGs
    const ICONS = {
      play: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
      pause: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>',
      fire: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c-.1 0-.2.1-.3.2C9.4 5.4 6 10.3 6 15c0 3.3 2.7 6 6 6s6-2.7 6-6c0-3.2-1.8-6.4-3.7-8.8-1-1.3-1.8-2.6-2.2-3.8-.1-.2-.2-.4-.3-.4h-.1z"/></svg>',
      music: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>',
      disc: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>',
      heart: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>',
      landmark: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M2 10h20v2H2zm2 4h3v6H4zm6 0h4v6h-4zm7 0h3v6h-3zM12 1 2 6v2h20V6z"/></svg>',
      radio: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3.24 6.15C2.51 6.43 2 7.17 2 8v12a2 2 0 002 2h16a2 2 0 002-2V8a2 2 0 00-2-2H8.3l8.26-3.34-.75-1.82L3.24 6.15zM7 20c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm13-8h-8v-2h8v2zm0 4h-8v-2h8v2z"/></svg>'
    };

    const stations = [
      {
        id: 'mirchi',
        name: 'Radio Mirchi 98.3 FM',
        description: 'Top Bollywood Charts • Live',
        icon: 'fire',
        color: 'linear-gradient(135deg, #ff9800, #ffc107)',
        streamUrl: 'https://eu8.fastcast4u.com/proxy/clyedupq?mp=/1'
      },
      {
        id: 'bigfm',
        name: '92.7 Big FM',
        description: 'Retro & New Bollywood Hits',
        icon: 'music',
        color: 'linear-gradient(135deg, #e91e63, #ff6b6b)',
        streamUrl: 'https://stream.zeno.fm/dbstwo3dvhhtv'
      },
      {
        id: 'nasha',
        name: 'Radio Nasha 91.9 FM',
        description: 'Classic Melodies & Fun',
        icon: 'disc',
        color: 'linear-gradient(135deg, #00b894, #00cec9)',
        streamUrl: 'https://stream.zeno.fm/zu59ykebs2zuv'
      },
      {
        id: 'ishq',
        name: 'Ishq FM',
        description: 'Romantic Hits & Acoustic Mix',
        icon: 'heart',
        color: 'linear-gradient(135deg, #9c27b0, #673ab7)',
        streamUrl: 'https://drive.uber.radio/uber/bollywoodlove/icecast.audio'
      },
      {
        id: 'akashwani-mumbai',
        name: 'Akashwani Mumbai',
        description: 'AIR Mumbai • News, Culture & Live',
        icon: 'landmark',
        color: 'linear-gradient(135deg, #0984e3, #74b9ff)',
        streamUrl: 'https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio010/hlspbaudio010_Auto.m3u8'
      },
      {
        id: 'vividh-bharati-mumbai',
        name: 'Vividh Bharati Mumbai',
        description: 'AIR Vividh Bharati • Classic Hits & Sangeet',
        icon: 'radio',
        color: 'linear-gradient(135deg, #e17055, #d63031)',
        streamUrl: 'https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio011/hlspbaudio011_Auto.m3u8'
      }
    ];

    const audio = document.getElementById('radioPlayer');
    const stationsContainer = document.getElementById('stationsContainer');
    const nowPlayingText = document.getElementById('nowPlayingText');
    const liveBadge = document.getElementById('liveBadge');
    const statusText = document.getElementById('statusText');
    const visualizer = document.getElementById('visualizer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    let currentStation = null;
    let hlsInstance = null;

    // Fast Equalizer Setup
    const docFrag = document.createDocumentFragment();
    for (let i = 0; i < 24; i++) {
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.animationDelay = `${(i * 0.08) % 1.1}s`;
      docFrag.appendChild(bar);
    }
    visualizer.appendChild(docFrag);

    // Build Station UI
    function renderStations() {
      stationsContainer.innerHTML = '';
      stations.forEach(station => {
        const card = document.createElement('div');
        card.className = 'station-card';
        card.id = `station-${station.id}`;
        card.innerHTML = `
          <div class="station-icon" style="background: ${station.color};">
            ${ICONS[station.icon] || ''}
          </div>
          <div class="station-info">
            <div class="station-name">${station.name}</div>
            <div class="station-meta">${station.description}</div>
          </div>
          <button class="play-btn" data-id="${station.id}" aria-label="Play ${station.name}">
            ${ICONS.play}
          </button>
        `;
        card.addEventListener('click', () => togglePlay(station.id));
        stationsContainer.appendChild(card);
      });
    }
    renderStations();

    // Lockscreen & Control Center Integration
    function updateMediaSession(station) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: station.name,
          artist: station.description,
          album: 'Live Radio',
          artwork: [{ src: window.generatedAppIcon || '', sizes: '180x180', type: 'image/png' }]
        });

        navigator.mediaSession.setActionHandler('play', () => audio.play());
        navigator.mediaSession.setActionHandler('pause', () => audio.pause());
        navigator.mediaSession.setActionHandler('nexttrack', () => changeStation(1));
        navigator.mediaSession.setActionHandler('previoustrack', () => changeStation(-1));
      }
    }

    function setPlaybackState(isPlaying) {
      if (isPlaying) {
        visualizer.classList.add('active');
        liveBadge.classList.add('live');
        statusText.textContent = "ON AIR";
        if (currentStation) updateCardState(currentStation.id, true);
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
      } else {
        visualizer.classList.remove('active');
        liveBadge.classList.remove('live');
        statusText.textContent = "PAUSED";
        if (currentStation) updateCardState(currentStation.id, false);
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
      }
    }

    // Lazy load HLS library only if required
    function loadHlsLibrary(callback) {
      if (window.Hls) return callback();
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.light.min.js';
      s.onload = callback;
      document.head.appendChild(s);
    }

    // Attach stream (supports native HLS on iOS & desktop fallback)
    function attachStream(url) {
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      if (url.includes('.m3u8')) {
        if (audio.canPlayType('application/vnd.apple.mpegurl')) {
          audio.src = url;
        } else {
          loadHlsLibrary(() => {
            if (window.Hls && Hls.isSupported()) {
              hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
              hlsInstance.loadSource(url);
              hlsInstance.attachMedia(audio);
            } else {
              audio.src = url;
            }
          });
        }
      } else {
        audio.src = url + (url.includes('?') ? '&' : '?') + 'nocache=' + Date.now();
      }
    }

    function playStation(station) {
      if (currentStation && currentStation.id !== station.id) {
        updateCardState(currentStation.id, false);
      }
      
      currentStation = station;
      highlightStation(station.id);
      localStorage.setItem('lastPlayedStationId', station.id);

      statusText.textContent = "CONNECTING...";
      nowPlayingText.textContent = station.name;

      attachStream(station.streamUrl);
      audio.load();

      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          updateMediaSession(station);
        }).catch(() => {
          // Handled Autoplay restriction
          statusText.textContent = "TAP TO LISTEN";
          nowPlayingText.textContent = station.name;
          setPlaybackState(false);

          const handleUserInteraction = () => {
            audio.play().then(() => updateMediaSession(station));
            window.removeEventListener('click', handleUserInteraction);
            window.removeEventListener('touchstart', handleUserInteraction);
          };
          window.addEventListener('click', handleUserInteraction);
          window.addEventListener('touchstart', handleUserInteraction);
        });
      }
    }

    function togglePlay(stationId) {
      const station = stations.find(s => s.id === stationId);
      if (!station) return;
      
      if (currentStation && currentStation.id === stationId) {
        if (audio.paused) {
          playStation(station);
        } else {
          audio.pause();
        }
      } else {
        playStation(station);
      }
    }

    function changeStation(step) {
      const currentIndex = currentStation ? stations.findIndex(s => s.id === currentStation.id) : 0;
      let nextIndex = (currentIndex + step + stations.length) % stations.length;
      playStation(stations[nextIndex]);
    }

    function updateCardState(stationId, isPlaying) {
      const btn = document.querySelector(`.station-card#station-${stationId} .play-btn`);
      if (!btn) return;
      if (isPlaying) {
        btn.classList.add('playing');
        btn.innerHTML = ICONS.pause;
      } else {
        btn.classList.remove('playing');
        btn.innerHTML = ICONS.play;
      }
    }

    function highlightStation(stationId) {
      document.querySelectorAll('.station-card').forEach(c => c.classList.remove('playing'));
      const activeCard = document.getElementById(`station-${stationId}`);
      if (activeCard) activeCard.classList.add('playing');
    }

    // Audio Event Handlers
    audio.addEventListener('playing', () => setPlaybackState(true));
    audio.addEventListener('pause', () => setPlaybackState(false));
    audio.addEventListener('waiting', () => { statusText.textContent = "BUFFERING"; });
    audio.addEventListener('error', () => {
      statusText.textContent = "OFFLINE";
      nowPlayingText.textContent = "Stream temporarily unavailable";
      setPlaybackState(false);
    });

    nextBtn.addEventListener('click', () => changeStation(1));
    prevBtn.addEventListener('click', () => changeStation(-1));

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        if (currentStation) togglePlay(currentStation.id);
        else playStation(stations[0]);
      } else if (e.code === 'ArrowRight') {
        changeStation(1);
      } else if (e.code === 'ArrowLeft') {
        changeStation(-1);
      }
    });

    // Deferred App Icon & Manifest Generator (Runs after paint)
    setTimeout(() => {
      const canvas = document.createElement('canvas');
      canvas.width = 180;
      canvas.height = 180;
      const ctx = canvas.getContext('2d');

      const bgGrad = ctx.createLinearGradient(0, 0, 180, 180);
      bgGrad.addColorStop(0, '#1f1d36');
      bgGrad.addColorStop(1, '#0e131f');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 180, 180);

      const circleGrad = ctx.createLinearGradient(20, 20, 160, 160);
      circleGrad.addColorStop(0, '#ff6b6b');
      circleGrad.addColorStop(1, '#ffa502');
      ctx.beginPath();
      ctx.arc(90, 95, 56, 0, Math.PI * 2);
      ctx.fillStyle = circleGrad;
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      if (ctx.roundRect) ctx.roundRect(52, 75, 76, 44, 10);
      else ctx.rect(52, 75, 76, 44);
      ctx.fill();

      ctx.fillStyle = '#ff6b6b';
      ctx.beginPath();
      ctx.arc(74, 97, 13, 0, Math.PI * 2);
      ctx.fill();

      const iconUrl = canvas.toDataURL('image/png');
      window.generatedAppIcon = iconUrl;
      document.getElementById('apple-icon').href = iconUrl;
      document.getElementById('favicon').href = iconUrl;

      const manifest = {
        name: "My Radio Stations",
        short_name: "Radio",
        start_url: "./",
        display: "standalone",
        background_color: "#12131C",
        theme_color: "#12131C",
        icons: [{ src: iconUrl, sizes: "180x180", type: "image/png" }]
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      document.getElementById('pwa-manifest').href = URL.createObjectURL(blob);
    }, 100);

    // Initial Station Preparation
    window.addEventListener('DOMContentLoaded', () => {
      const savedStationId = localStorage.getItem('lastPlayedStationId');
      const targetStation = stations.find(s => s.id === savedStationId) || stations[0];
      currentStation = targetStation;
      nowPlayingText.textContent = targetStation.name;
      highlightStation(targetStation.id);
    });
  </script>
</body>
</html>
