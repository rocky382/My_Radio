<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>My Radio Stations</title>
  
  <!-- iOS PWA Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Radio">
  <meta name="theme-color" content="#1a1a2e">

  <!-- iOS-Compatible PNG Base64 App Icon (Fixes the SVG black box glitch) -->
  <link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAKAAAACgCAYAAACLz9htAAAABHNCSVQICAgIfAhkiAAAAAlwSFlzAAALEwAACxMBAJqcGAAAAWJJREFUeJzt0DERAAAIAzH862cbC3sUBNmSPcd6A8DQdwAcGIABBiCAAYZgAAYYgAEGYIABGGAAAWCAARhgAAEYYAAGGIABBhCAARhgAAEYYAAGYIABGGAAAWCAAQZggAEYYAAGYIABGIAABmCAAQRggAEYYAAGGIABGGAAAWCAAQZggAEYgAEGYIABGGAAARhgAAYYgAEGYIABGIAABmCAAQRggAEYYAAGGIABGGAAAWCAAQRggAEYYAAGGIABGGAAARiAAQZggAEYYAABGGAAAWCAAQRggAEYgAEGYIABGGAAARhgAAEYYAABGIAABmCAAQRggAEYYAABGGAAARiAAQZggAEYYAABGGAAARiAAQZggAEEYIABGGAAARhgAAEYgAEGYIABGGAAARhgAAEYgAEEYIABGGAAARiAAQZggAEEYIABGGAAARiAAQYQAAAAMNf51wYmgAAAAElFTkSuQmCC">
  
  <!-- Fallback Vector Icon for Modern Browsers -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%231a1a2e'/%3E%3Ccircle cx='90' cy='95' r='56' fill='%23ff6b6b'/%3E%3C/svg%3E">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: #fff;
      min-height: 100vh;
      /* Accurate iPhone Dynamic Island & Home Indicator safe padding */
      padding-top: max(45px, env(safe-area-inset-top));
      padding-bottom: max(30px, env(safe-area-inset-bottom));
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
      touch-action: manipulation;
    }
    
    .header {
      text-align: center;
      padding: 10px 0;
    }
    
    .header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 4px;
      background: linear-gradient(90deg, #ff6b6b, #ffa502);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .header p {
      color: #a0a0c0;
      font-size: 0.9rem;
    }
    
    .visualizer {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      height: 36px;
      gap: 4px;
      margin: 15px 0;
    }
    
    .bar {
      width: 4px;
      height: 6px;
      background: linear-gradient(to top, #ff6b6b, #ffa502);
      border-radius: 2px;
      transition: height 0.2s ease;
    }
    
    .visualizer.active .bar {
      animation: visualizer 1.2s infinite ease-in-out;
    }
    
    @keyframes visualizer {
      0%, 100% { height: 6px; }
      50% { height: 32px; }
    }
    
    .now-playing {
      text-align: center;
      padding: 14px;
      margin: 10px auto 20px auto;
      max-width: 650px;
      background: rgba(30, 30, 46, 0.7);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .now-playing h3 {
      color: #ff6b6b;
      margin-bottom: 4px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .now-playing p {
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
    }
    
    .controls {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 25px;
    }
    
    .nav-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
    }
    
    .nav-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.2);
    }
    
    .stations-container {
      max-width: 650px;
      margin: 0 auto;
      display: grid;
      gap: 12px;
    }
    
    .station-card {
      background: rgba(30, 30, 46, 0.7);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 0.1s ease, border 0.2s ease, background 0.2s ease;
    }
    
    .station-card:active {
      transform: scale(0.98);
      background: rgba(45, 45, 68, 0.85);
    }
    
    .station-card.playing {
      border: 1px solid #ff6b6b;
      box-shadow: 0 0 16px rgba(255, 107, 107, 0.3);
      background: rgba(40, 40, 62, 0.9);
    }
    
    .station-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      pointer-events: none;
    }
    
    .station-info {
      flex: 1;
      pointer-events: none;
      min-width: 0; /* Prevents text overflow */
    }
    
    .station-name {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .station-meta {
      color: #a0a0c0;
      font-size: 0.8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .play-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff6b6b, #ffa502);
      border: none;
      color: white;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      pointer-events: none;
      transition: background 0.3s ease;
    }
    
    .play-btn.playing {
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
    }
    
    .developer-credit {
      text-align: center;
      margin-top: 30px;
      font-size: 0.9rem;
      color: #a0a0c0;
    }
    
    .developer-name {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 14px;
      background: rgba(255, 107, 107, 0.12);
      border-radius: 20px;
      font-weight: 600;
      color: #ff6b6b;
    }
  </style>
</head>
<body>
  <!-- preload="none" saves iOS cellular data and ensures clean buffer assignment -->
  <audio id="radioPlayer" preload="none" playsinline webkit-playsinline></audio>

  <div class="header">
    <h1><i class="fas fa-radio"></i> My Radio Stations</h1>
    <p>Stream live to your phone & car</p>
  </div>
  
  <div class="visualizer" id="visualizer"></div>
  
  <div class="now-playing" id="nowPlaying">
    <h3 id="statusLabel">Status</h3>
    <p id="nowPlayingText">Select a station to start</p>
  </div>
  
  <div class="controls">
    <button class="nav-btn" id="prevBtn" aria-label="Previous Station">
      <i class="fas fa-step-backward"></i>
    </button>
    <button class="nav-btn" id="nextBtn" aria-label="Next Station">
      <i class="fas fa-step-forward"></i>
    </button>
  </div>
  
  <div class="stations-container" id="stationsContainer"></div>
  
  <div class="developer-credit">
    <p>Developed with <i class="fas fa-heart" style="color: #ff6b6b;"></i> by</p>
    <div class="developer-name">ROCKY</div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const stations = [
        {
          id: 'mirchi',
          name: 'Radio Mirchi 98.3 FM',
          description: 'Top Charts • Entertainment',
          icon: 'fas fa-fire',
          color: 'linear-gradient(135deg, #ff9800, #ffc107)',
          streamUrl: 'https://eu8.fastcast4u.com/proxy/clyedupq?mp=/1'
        },
        {
          id: 'bigfm',
          name: '92.7 Big FM',
          description: 'Bollywood Hits • Live Music',
          icon: 'fas fa-music',
          color: 'linear-gradient(135deg, #e91e63, #ff6b6b)',
          streamUrl: 'https://stream.zeno.fm/dbstwo3dvhhtv'
        },
        {
          id: 'nasha',
          name: 'Radio Nasha 91.9 FM',
          description: 'Fun & Comedy • Hindi Mix',
          icon: 'fas fa-laugh',
          color: 'linear-gradient(135deg, #4caf50, #8bc34a)',
          streamUrl: 'https://stream.zeno.fm/zu59ykebs2zuv'
        },
        {
          id: 'ishq',
          name: 'Ishq FM',
          description: 'Romantic Hits • Love Songs',
          icon: 'fas fa-heart',
          color: 'linear-gradient(135deg, #9c27b0, #673ab7)',
          streamUrl: 'https://drive.uber.radio/uber/bollywoodlove/icecast.audio'
        },
        {
          id: 'akashwani-mumbai',
          name: 'Akashwani Mumbai',
          description: 'News • Culture • Regional Mix',
          icon: 'fas fa-tower-broadcast',
          color: 'linear-gradient(135deg, #00b4db, #0083b0)',
          streamUrl: 'https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio010/hlspbaudio010_Auto.m3u8'
        },
        {
          id: 'vividh-bharati-mumbai',
          name: 'Vividh Bharati Mumbai',
          description: 'Classic Melodies • Retro Bollywood',
          icon: 'fas fa-record-vinyl',
          color: 'linear-gradient(135deg, #11998e, #38ef7d)',
          streamUrl: 'https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio011/hlspbaudio011_Auto.m3u8'
        }
      ];

      const audio = document.getElementById('radioPlayer');
      const stationsContainer = document.getElementById('stationsContainer');
      const nowPlayingText = document.getElementById('nowPlayingText');
      const visualizer = document.getElementById('visualizer');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');

      let currentStation = null;
      let hls = null;

      // Build visualizer bars
      for (let i = 0; i < 20; i++) {
        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.animationDelay = `${(i % 5) * 0.18}s`;
        visualizer.appendChild(bar);
      }

      // Render cards
      stations.forEach(station => {
        const card = document.createElement('div');
        card.className = 'station-card';
        card.id = `station-${station.id}`;
        card.setAttribute('data-id', station.id);
        card.setAttribute('role', 'button');
        
        card.innerHTML = `
          <div class="station-icon" style="background: ${station.color};">
            <i class="${station.icon}"></i>
          </div>
          <div class="station-info">
            <div class="station-name">${station.name}</div>
            <div class="station-meta">${station.description}</div>
          </div>
          <div class="play-btn" data-btn-id="${station.id}">
            <i class="fas fa-play"></i>
          </div>
        `;
        stationsContainer.appendChild(card);
      });

      // Initialize MediaSession action handlers ONCE (Prevents memory leaks on iOS)
      if ('mediaSession' in navigator) {
        navigator.mediaSession.setActionHandler('play', () => {
          audio.play().catch(handleError);
        });
        navigator.mediaSession.setActionHandler('pause', () => {
          audio.pause();
        });
        navigator.mediaSession.setActionHandler('nexttrack', () => {
          changeStation(1);
        });
        navigator.mediaSession.setActionHandler('previoustrack', () => {
          changeStation(-1);
        });
      }

      function updateMediaMetadata(station) {
        if ('mediaSession' in navigator) {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: station.name,
            artist: station.description,
            album: 'Live Radio'
          });
        }
      }

      function setPlaybackState(isPlaying) {
        if (isPlaying) {
          visualizer.classList.add('active');
          if (currentStation) updatePlayButton(currentStation.id, true);
          if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
        } else {
          visualizer.classList.remove('active');
          if (currentStation) updatePlayButton(currentStation.id, false);
          if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
        }
      }

      function playStation(station) {
        if (currentStation && currentStation.id !== station.id) {
          updatePlayButton(currentStation.id, false);
        }
        
        currentStation = station;
        highlightPlayingStation(station.id);
        nowPlayingText.textContent = `Connecting to ${station.name}...`;

        if (hls) {
          hls.destroy();
          hls = null;
        }

        const isM3u8 = station.streamUrl.includes('.m3u8');
        const canPlayNativeHls = audio.canPlayType('application/vnd.apple.mpegurl');

        // iOS Safari Native HLS or standard stream handling
        if (isM3u8 && (!canPlayNativeHls || canPlayNativeHls === '') && Hls.isSupported()) {
          // Android / Desktop Chrome fallback
          hls = new Hls({ enableWorker: true });
          hls.loadSource(station.streamUrl);
          hls.attachMedia(audio);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            audio.play().then(() => updateMediaMetadata(station)).catch(handleError);
          });
          hls.on(Hls.Events.ERROR, (e, data) => {
            if (data.fatal) handleError(data);
          });
        } else {
          // iOS Safari Path: Must call .load() before .play() when changing audio sources
          audio.src = station.streamUrl;
          audio.load(); // <-- MANDATORY FOR IPHONE STABILITY
          
          const playPromise = audio.play();
          if (playPromise !== undefined) {
            playPromise
              .then(() => updateMediaMetadata(station))
              .catch(handleError);
          }
        }
      }

      function handleError(err) {
        if (err && err.name === 'AbortError') return;
        nowPlayingText.textContent = 'Stream unavailable. Try another.';
        setPlaybackState(false);
      }

      function togglePlay(stationId) {
        const station = stations.find(s => s.id === stationId);
        if (!station) return;
        
        if (currentStation && currentStation.id === stationId) {
          if (audio.paused) {
            audio.play().catch(handleError);
          } else {
            audio.pause();
          }
        } else {
          playStation(station);
        }
      }

      function changeStation(direction) {
        let currentIndex = currentStation ? stations.findIndex(s => s.id === currentStation.id) : -1;
        let targetIndex = currentIndex + direction;
        
        if (targetIndex >= stations.length) targetIndex = 0;
        if (targetIndex < 0) targetIndex = stations.length - 1;

        playStation(stations[targetIndex]);
      }

      // Audio Event Listeners
      audio.addEventListener('playing', () => {
        setPlaybackState(true);
        nowPlayingText.textContent = currentStation.name;
      });

      audio.addEventListener('pause', () => {
        setPlaybackState(false);
        nowPlayingText.textContent = `Paused (${currentStation ? currentStation.name : ''})`;
      });

      audio.addEventListener('waiting', () => {
        nowPlayingText.textContent = 'Buffering...';
      });

      audio.addEventListener('error', () => {
        handleError(null);
      });

      // Station Click Listener
      stationsContainer.addEventListener('click', (e) => {
        const card = e.target.closest('.station-card');
        if (card) {
          const id = card.getAttribute('data-id');
          if (id) togglePlay(id);
        }
      });

      nextBtn.addEventListener('click', () => changeStation(1));
      prevBtn.addEventListener('click', () => changeStation(-1));

      function updatePlayButton(stationId, isPlaying) {
        const button = document.querySelector(`.play-btn[data-btn-id="${stationId}"]`);
        if (!button) return;
        const icon = button.querySelector('i');
        if (isPlaying) {
          button.classList.add('playing');
          icon.className = 'fas fa-pause';
        } else {
          button.classList.remove('playing');
          icon.className = 'fas fa-play';
        }
      }

      function highlightPlayingStation(stationId) {
        document.querySelectorAll('.station-card').forEach(card => card.classList.remove('playing'));
        const activeCard = document.getElementById(`station-${stationId}`);
        if (activeCard) activeCard.classList.add('playing');
      }
    });
  </script>
</body>
</html>
