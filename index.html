<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Radio Stations</title>
  
  <!-- iOS PWA Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Radio">
  <meta name="theme-color" content="#1a1a2e">

  <!-- Placeholders for Inbuilt Generated Icons -->
  <link rel="apple-touch-icon" id="apple-icon" sizes="180x180">
  <link rel="icon" id="favicon" type="image/png">
  <link rel="manifest" id="pwa-manifest">

  <!-- INBUILT ICON GENERATOR SCRIPT (Executes instantly before rendering) -->
  <script>
    (function generateInbuiltIcon() {
      const canvas = document.createElement('canvas');
      canvas.width = 180;
      canvas.height = 180;
      const ctx = canvas.getContext('2d');

      // 1. Dark solid background (Prevents iOS transparency bug)
      const bgGrad = ctx.createLinearGradient(0, 0, 180, 180);
      bgGrad.addColorStop(0, '#1f1d36');
      bgGrad.addColorStop(1, '#0e131f');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 180, 180);

      // 2. Vibrant gradient inner circle
      const circleGrad = ctx.createLinearGradient(20, 20, 160, 160);
      circleGrad.addColorStop(0, '#ff6b6b');
      circleGrad.addColorStop(1, '#ffa502');
      ctx.beginPath();
      ctx.arc(90, 95, 56, 0, Math.PI * 2);
      ctx.fillStyle = circleGrad;
      ctx.fill();

      // 3. Antenna
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(65, 75);
      ctx.lineTo(48, 50);
      ctx.stroke();

      // Antenna tip
      ctx.beginPath();
      ctx.arc(46, 48, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      // 4. Radio Body
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(52, 75, 76, 44, 10);
      } else {
        ctx.rect(52, 75, 76, 44);
      }
      ctx.fill();

      // 5. Speaker Grill
      ctx.fillStyle = '#ff6b6b';
      ctx.beginPath();
      ctx.arc(74, 97, 13, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(74, 97, 5, 0, Math.PI * 2);
      ctx.fill();

      // 6. Tuner Display & Dials
      ctx.fillStyle = '#ffa502';
      ctx.fillRect(96, 86, 22, 5);
      ctx.fillRect(96, 94, 22, 5);
      ctx.fillRect(96, 102, 22, 5);

      // 7. Radio Waves
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(90, 95, 68, -Math.PI * 0.75, -Math.PI * 0.25);
      ctx.stroke();

      // Export base64 Data URL
      const iconUrl = canvas.toDataURL('image/png');
      window.generatedAppIcon = iconUrl;

      // Assign to iOS Home Screen Icon & Favicon
      document.getElementById('apple-icon').href = iconUrl;
      document.getElementById('favicon').href = iconUrl;

      // Inline PWA Web Manifest
      const manifest = {
        name: "My Radio Stations",
        short_name: "Radio",
        start_url: "./",
        display: "standalone",
        background_color: "#1a1a2e",
        theme_color: "#1a1a2e",
        icons: [{ src: iconUrl, sizes: "180x180", type: "image/png" }]
      };
      const stringManifest = JSON.stringify(manifest);
      const manifestBlob = new Blob([stringManifest], { type: 'application/manifest+json' });
      document.getElementById('pwa-manifest').href = URL.createObjectURL(manifestBlob);
    })();
  </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
      padding-bottom: 80px;
    }
    
    .header {
      text-align: center;
      padding: 20px 0 10px 0;
    }
    
    .header h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #ff6b6b, #ffa502);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .header p {
      color: #a0a0c0;
      font-size: 1rem;
    }
    
    .visualizer {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      height: 45px;
      gap: 4px;
      margin: 15px 0;
    }
    
    .bar {
      width: 4px;
      height: 6px;
      background: linear-gradient(to top, #ff6b6b, #ffa502);
      border-radius: 2px;
      transition: height 0.2s ease;
    }
    
    .visualizer.active .bar {
      animation: visualizer 1.2s infinite ease-in-out;
    }
    
    @keyframes visualizer {
      0%, 100% { height: 6px; }
      50% { height: 40px; }
    }
    
    .now-playing {
      text-align: center;
      padding: 15px;
      margin: 15px auto;
      max-width: 650px;
      background: rgba(30, 30, 46, 0.7);
      border-radius: 15px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .now-playing h3 {
      color: #ff6b6b;
      margin-bottom: 6px;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .now-playing p {
      font-size: 1.15rem;
      font-weight: 600;
      color: #fff;
    }
    
    .controls {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin: 20px 0;
    }
    
    .nav-btn {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }
    
    .nav-btn:active {
      transform: scale(0.95);
    }
    
    .stations-container {
      max-width: 650px;
      margin: 0 auto;
      display: grid;
      gap: 15px;
    }
    
    .station-card {
      background: rgba(30, 30, 46, 0.7);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 15px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: border 0.3s ease;
    }
    
    .station-card.playing {
      border: 1px solid #ff6b6b;
      box-shadow: 0 0 15px rgba(255, 107, 107, 0.35);
    }
    
    .station-icon {
      width: 55px;
      height: 55px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }
    
    .station-info {
      flex: 1;
    }
    
    .station-name {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    
    .station-meta {
      color: #a0a0c0;
      font-size: 0.85rem;
    }
    
    .play-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff6b6b, #ffa502);
      border: none;
      color: white;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    
    .play-btn:active {
      transform: scale(0.95);
    }
    
    .play-btn.playing {
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
    }
    
    .developer-credit {
      text-align: center;
      margin-top: 35px;
      font-size: 1rem;
      color: #a0a0c0;
    }
    
    .developer-name {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 18px;
      background: rgba(255, 107, 107, 0.1);
      border-radius: 20px;
      font-weight: 600;
      color: #ff6b6b;
    }
  </style>
</head>
<body>
  <!-- Embedded audio tag with iOS attributes -->
  <audio id="radioPlayer" playsinline webkit-playsinline preload="none"></audio>

  <div class="header">
    <h1><i class="fas fa-music"></i> My Radio Stations</h1>
    <p>Stream live to your phone & car</p>
  </div>
  
  <div class="visualizer" id="visualizer"></div>
  
  <div class="now-playing" id="nowPlaying">
    <h3 id="statusLabel">Status</h3>
    <p id="nowPlayingText">Select a station to start</p>
  </div>
  
  <div class="controls">
    <button class="nav-btn" id="prevBtn" aria-label="Previous Station">
      <i class="fas fa-step-backward"></i>
    </button>
    <button class="nav-btn" id="nextBtn" aria-label="Next Station">
      <i class="fas fa-step-forward"></i>
    </button>
  </div>
  
  <div class="stations-container" id="stationsContainer"></div>
  
  <div class="developer-credit">
    <p>Developed with <i class="fas fa-heart" style="color: #ff6b6b;"></i> by</p>
    <div class="developer-name">ROCKY</div>
  </div>

  <script>
    const stations = [
      {
        id: 'mirchi',
        name: 'Radio Mirchi 98.3 FM',
        description: 'Top Charts • Entertainment',
        icon: 'fas fa-fire',
        color: 'linear-gradient(135deg, #ff9800, #ffc107)',
        streamUrl: 'https://eu8.fastcast4u.com/proxy/clyedupq?mp=/1'
      },
      {
        id: 'bigfm',
        name: '92.7 Big FM',
        description: 'Bollywood Hits • Live Music',
        icon: 'fas fa-music',
        color: 'linear-gradient(135deg, #e91e63, #ff6b6b)',
        streamUrl: 'https://stream.zeno.fm/dbstwo3dvhhtv'
      },
      {
        id: 'nasha',
        name: 'Radio Nasha 91.9 FM',
        description: 'Fun & Comedy • Hindi Mix',
        icon: 'fas fa-laugh',
        color: 'linear-gradient(135deg, #4caf50, #8bc34a)',
        streamUrl: 'https://stream.zeno.fm/zu59ykebs2zuv'
      },
      {
        id: 'ishq',
        name: 'Ishq FM',
        description: 'Romantic Hits • Love Songs',
        icon: 'fas fa-heart',
        color: 'linear-gradient(135deg, #9c27b0, #673ab7)',
        streamUrl: 'https://drive.uber.radio/uber/bollywoodlove/icecast.audio'
      }
    ];

    const audio = document.getElementById('radioPlayer');
    let currentStation = null;

    const stationsContainer = document.getElementById('stationsContainer');
    const nowPlayingText = document.getElementById('nowPlayingText');
    const visualizer = document.getElementById('visualizer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    // Visualizer Bars
    for (let i = 0; i < 24; i++) {
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.animationDelay = `${(i % 6) * 0.18}s`;
      visualizer.appendChild(bar);
    }

    // Populate Station Cards
    stations.forEach(station => {
      const stationCard = document.createElement('div');
      stationCard.className = 'station-card';
      stationCard.id = `station-${station.id}`;
      
      stationCard.innerHTML = `
        <div class="station-icon" style="background: ${station.color};">
          <i class="${station.icon}"></i>
        </div>
        <div class="station-info">
          <div class="station-name">${station.name}</div>
          <div class="station-meta">${station.description}</div>
        </div>
        <button class="play-btn" data-id="${station.id}">
          <i class="fas fa-play"></i>
        </button>
      `;
      stationsContainer.appendChild(stationCard);
    });

    // Update Bluetooth & Lock Screen Information (Uses the Generated Icon)
    function updateMediaSession(station) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: station.name,
          artist: station.description,
          album: 'Live Radio',
          artwork: [
            { src: window.generatedAppIcon, sizes: '180x180', type: 'image/png' }
          ]
        });

        navigator.mediaSession.setActionHandler('play', () => audio.play());
        navigator.mediaSession.setActionHandler('pause', () => audio.pause());
        navigator.mediaSession.setActionHandler('nexttrack', () => changeStation(1));
        navigator.mediaSession.setActionHandler('previoustrack', () => changeStation(-1));
      }
    }

    function setPlaybackState(isPlaying) {
      if (isPlaying) {
        visualizer.classList.add('active');
        if (currentStation) updatePlayButton(currentStation.id, true);
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
      } else {
        visualizer.classList.remove('active');
        if (currentStation) updatePlayButton(currentStation.id, false);
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
      }
    }

    function playStation(station) {
      if (currentStation && currentStation.id !== station.id) {
        updatePlayButton(currentStation.id, false);
      }
      
      currentStation = station;
      highlightPlayingStation(station.id);
      nowPlayingText.textContent = `Connecting to ${station.name}...`;

      audio.src = station.streamUrl;
      audio.load();

      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise
          .then(() => {
            updateMediaSession(station);
          })
          .catch(err => {
            console.error('Playback failed:', err);
            nowPlayingText.textContent = 'Stream unavailable. Try another.';
            setPlaybackState(false);
          });
      }
    }

    function togglePlay(stationId) {
      const station = stations.find(s => s.id === stationId);
      if (!station) return;
      
      if (currentStation && currentStation.id === stationId) {
        if (audio.paused) {
          audio.play();
        } else {
          audio.pause();
        }
      } else {
        playStation(station);
      }
    }

    function changeStation(direction) {
      const currentIndex = currentStation ? stations.findIndex(s => s.id === currentStation.id) : 0;
      let targetIndex = currentIndex + direction;
      
      if (targetIndex >= stations.length) targetIndex = 0;
      if (targetIndex < 0) targetIndex = stations.length - 1;

      playStation(stations[targetIndex]);
    }

    audio.addEventListener('playing', () => {
      setPlaybackState(true);
      nowPlayingText.textContent = currentStation.name;
    });

    audio.addEventListener('pause', () => {
      setPlaybackState(false);
      nowPlayingText.textContent = `Paused (${currentStation ? currentStation.name : ''})`;
    });

    audio.addEventListener('waiting', () => {
      nowPlayingText.textContent = 'Buffering...';
    });

    audio.addEventListener('error', () => {
      nowPlayingText.textContent = 'Error connecting to radio.';
      setPlaybackState(false);
    });

    stationsContainer.addEventListener('click', (e) => {
      const btn = e.target.closest('.play-btn');
      if (btn) {
        const id = btn.getAttribute('data-id');
        togglePlay(id);
      }
    });

    nextBtn.addEventListener('click', () => changeStation(1));
    prevBtn.addEventListener('click', () => changeStation(-1));

    function updatePlayButton(stationId, isPlaying) {
      const button = document.querySelector(`.play-btn[data-id="${stationId}"]`);
      if (!button) return;
      const icon = button.querySelector('i');
      if (isPlaying) {
        button.classList.add('playing');
        icon.className = 'fas fa-pause';
      } else {
        button.classList.remove('playing');
        icon.className = 'fas fa-play';
      }
    }

    function highlightPlayingStation(stationId) {
      document.querySelectorAll('.station-card').forEach(card => card.classList.remove('playing'));
      const activeCard = document.getElementById(`station-${stationId}`);
      if (activeCard) activeCard.classList.add('playing');
    }
  </script>
</body>
</html>
