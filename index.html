<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>My Radio Stations</title>
  
  <!-- iOS PWA Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Radio">
  <meta name="theme-color" content="#1a1a2e">

  <!-- Direct Vector Icons for iOS (Instant Native Loading, Zero Script Crash) -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%231a1a2e'/%3E%3Ccircle cx='90' cy='95' r='56' fill='%23ff6b6b'/%3E%3Crect x='52' y='75' width='76' height='44' rx='10' fill='%23ffffff'/%3E%3Ccircle cx='74' cy='97' r='12' fill='%23ff6b6b'/%3E%3Ccircle cx='74' cy='97' r='5' fill='%23ffffff'/%3E%3Crect x='96' y='86' width='22' height='5' fill='%23ffa502' rx='2.5'/%3E%3Crect x='96' y='94' width='22' height='5' fill='%23ffa502' rx='2.5'/%3E%3Crect x='96' y='102' width='22' height='5' fill='%23ffa502' rx='2.5'/%3E%3Cpath d='M65 75 L48 50' stroke='%23ffffff' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='46' cy='48' r='4.5' fill='%23ffffff'/%3E%3C/svg%3E">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%231a1a2e'/%3E%3Ccircle cx='90' cy='95' r='56' fill='%23ff6b6b'/%3E%3C/svg%3E">
  
  <!-- Safe Data-URI Manifest -->
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22My%20Radio%22%2C%22short_name%22%3A%22Radio%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%231a1a2e%22%2C%22theme_color%22%3A%22%231a1a2e%22%7D">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: #fff;
      min-height: 100vh;
      /* iPhone Notch & Dynamic Island Safe Area */
      padding-top: max(25px, env(safe-area-inset-top));
      padding-bottom: max(60px, env(safe-area-inset-bottom));
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
    }
    
    .header {
      text-align: center;
      padding: 15px 0 10px 0;
    }
    
    .header h1 {
      font-size: 1.9rem;
      font-weight: 700;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #ff6b6b, #ffa502);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .header p {
      color: #a0a0c0;
      font-size: 0.95rem;
    }
    
    .visualizer {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      height: 40px;
      gap: 4px;
      margin: 15px 0;
    }
    
    .bar {
      width: 4px;
      height: 6px;
      background: linear-gradient(to top, #ff6b6b, #ffa502);
      border-radius: 2px;
      transition: height 0.2s ease;
    }
    
    .visualizer.active .bar {
      animation: visualizer 1.2s infinite ease-in-out;
    }
    
    @keyframes visualizer {
      0%, 100% { height: 6px; }
      50% { height: 38px; }
    }
    
    .now-playing {
      text-align: center;
      padding: 15px;
      margin: 15px auto;
      max-width: 650px;
      background: rgba(30, 30, 46, 0.7);
      border-radius: 15px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .now-playing h3 {
      color: #ff6b6b;
      margin-bottom: 6px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .now-playing p {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
    }
    
    .controls {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin: 20px 0;
    }
    
    .nav-btn {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    
    .nav-btn:active {
      transform: scale(0.95);
    }
    
    .stations-container {
      max-width: 650px;
      margin: 0 auto;
      display: grid;
      gap: 12px;
    }
    
    /* WHOLE CARD CLICKABLE STYLING */
    .station-card {
      background: rgba(30, 30, 46, 0.7);
      border-radius: 16px;
      padding: 15px 18px;
      display: flex;
      align-items: center;
      gap: 15px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 0.15s ease, border 0.3s ease, background 0.2s ease, box-shadow 0.3s ease;
    }
    
    .station-card:active {
      transform: scale(0.97);
      background: rgba(45, 45, 68, 0.85);
    }
    
    .station-card.playing {
      border: 1px solid #ff6b6b;
      box-shadow: 0 0 15px rgba(255, 107, 107, 0.35);
      background: rgba(38, 38, 58, 0.85);
    }
    
    .station-icon {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
      pointer-events: none;
    }
    
    .station-info {
      flex: 1;
      pointer-events: none;
    }
    
    .station-name {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 3px;
    }
    
    .station-meta {
      color: #a0a0c0;
      font-size: 0.8rem;
    }
    
    .play-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff6b6b, #ffa502);
      border: none;
      color: white;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      pointer-events: none; /* Passes tap smoothly through to whole card */
      transition: background 0.3s ease;
    }
    
    .play-btn.playing {
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
    }
    
    .developer-credit {
      text-align: center;
      margin-top: 30px;
      font-size: 0.95rem;
      color: #a0a0c0;
    }
    
    .developer-name {
      display: inline-block;
      margin-top: 8px;
      padding: 5px 16px;
      background: rgba(255, 107, 107, 0.1);
      border-radius: 20px;
      font-weight: 600;
      color: #ff6b6b;
    }
  </style>
</head>
<body>
  <audio id="radioPlayer" playsinline webkit-playsinline></audio>

  <div class="header">
    <h1><i class="fas fa-music"></i> My Radio Stations</h1>
    <p>Stream live to your phone & car</p>
  </div>
  
  <div class="visualizer" id="visualizer"></div>
  
  <div class="now-playing" id="nowPlaying">
    <h3 id="statusLabel">Status</h3>
    <p id="nowPlayingText">Select a station to start</p>
  </div>
  
  <div class="controls">
    <button class="nav-btn" id="prevBtn" aria-label="Previous Station">
      <i class="fas fa-step-backward"></i>
    </button>
    <button class="nav-btn" id="nextBtn" aria-label="Next Station">
      <i class="fas fa-step-forward"></i>
    </button>
  </div>
  
  <div class="stations-container" id="stationsContainer"></div>
  
  <div class="developer-credit">
    <p>Developed with <i class="fas fa-heart" style="color: #ff6b6b;"></i> by</p>
    <div class="developer-name">ROCKY</div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const stations = [
        {
          id: 'mirchi',
          name: 'Radio Mirchi 98.3 FM',
          description: 'Top Charts • Entertainment',
          icon: 'fas fa-fire',
          color: 'linear-gradient(135deg, #ff9800, #ffc107)',
          streamUrl: 'https://eu8.fastcast4u.com/proxy/clyedupq?mp=/1'
        },
        {
          id: 'bigfm',
          name: '92.7 Big FM',
          description: 'Bollywood Hits • Live Music',
          icon: 'fas fa-music',
          color: 'linear-gradient(135deg, #e91e63, #ff6b6b)',
          streamUrl: 'https://stream.zeno.fm/dbstwo3dvhhtv'
        },
        {
          id: 'nasha',
          name: 'Radio Nasha 91.9 FM',
          description: 'Fun & Comedy • Hindi Mix',
          icon: 'fas fa-laugh',
          color: 'linear-gradient(135deg, #4caf50, #8bc34a)',
          streamUrl: 'https://stream.zeno.fm/zu59ykebs2zuv'
        },
        {
          id: 'ishq',
          name: 'Ishq FM',
          description: 'Romantic Hits • Love Songs',
          icon: 'fas fa-heart',
          color: 'linear-gradient(135deg, #9c27b0, #673ab7)',
          streamUrl: 'https://drive.uber.radio/uber/bollywoodlove/icecast.audio'
        },
        {
          id: 'akashwani-mumbai',
          name: 'Akashwani Mumbai',
          description: 'News • Culture • Regional Mix',
          icon: 'fas fa-tower-broadcast',
          color: 'linear-gradient(135deg, #00b4db, #0083b0)',
          streamUrl: 'https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio010/hlspbaudio010_Auto.m3u8'
        },
        {
          id: 'vividh-bharati-mumbai',
          name: 'Vividh Bharati Mumbai',
          description: 'Classic Melodies • Retro Bollywood',
          icon: 'fas fa-record-vinyl',
          color: 'linear-gradient(135deg, #11998e, #38ef7d)',
          streamUrl: 'https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio011/hlspbaudio011_Auto.m3u8'
        }
      ];

      const audio = document.getElementById('radioPlayer');
      let currentStation = null;
      let hls = null;

      const stationsContainer = document.getElementById('stationsContainer');
      const nowPlayingText = document.getElementById('nowPlayingText');
      const visualizer = document.getElementById('visualizer');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');

      // Visualizer Bars
      for (let i = 0; i < 24; i++) {
        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.animationDelay = `${(i % 6) * 0.18}s`;
        visualizer.appendChild(bar);
      }

      // Populate Cards with data-id on the whole card
      stations.forEach(station => {
        const stationCard = document.createElement('div');
        stationCard.className = 'station-card';
        stationCard.id = `station-${station.id}`;
        stationCard.setAttribute('data-id', station.id);
        
        stationCard.innerHTML = `
          <div class="station-icon" style="background: ${station.color};">
            <i class="${station.icon}"></i>
          </div>
          <div class="station-info">
            <div class="station-name">${station.name}</div>
            <div class="station-meta">${station.description}</div>
          </div>
          <div class="play-btn" data-btn-id="${station.id}">
            <i class="fas fa-play"></i>
          </div>
        `;
        stationsContainer.appendChild(stationCard);
      });

      function updateMediaSession(station) {
        if ('mediaSession' in navigator) {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: station.name,
            artist: station.description,
            album: 'Live Radio',
            artwork: [
              { src: 'https://cdn-icons-png.flaticon.com/512/3075/3075908.png', sizes: '512x512', type: 'image/png' }
            ]
          });

          navigator.mediaSession.setActionHandler('play', () => audio.play());
          navigator.mediaSession.setActionHandler('pause', () => audio.pause());
          navigator.mediaSession.setActionHandler('nexttrack', () => changeStation(1));
          navigator.mediaSession.setActionHandler('previoustrack', () => changeStation(-1));
        }
      }

      function setPlaybackState(isPlaying) {
        if (isPlaying) {
          visualizer.classList.add('active');
          if (currentStation) updatePlayButton(currentStation.id, true);
          if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
        } else {
          visualizer.classList.remove('active');
          if (currentStation) updatePlayButton(currentStation.id, false);
          if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
        }
      }

      function playStation(station) {
        if (currentStation && currentStation.id !== station.id) {
          updatePlayButton(currentStation.id, false);
        }
        
        currentStation = station;
        highlightPlayingStation(station.id);
        nowPlayingText.textContent = `Connecting to ${station.name}...`;

        if (hls) {
          hls.destroy();
          hls = null;
        }

        const isM3u8 = station.streamUrl.includes('.m3u8');
        const canPlayNativeHls = audio.canPlayType('application/vnd.apple.mpegurl');

        if (isM3u8 && !canPlayNativeHls && Hls.isSupported()) {
          hls = new Hls({ enableWorker: true });
          hls.loadSource(station.streamUrl);
          hls.attachMedia(audio);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            audio.play().then(() => updateMediaSession(station)).catch(handleError);
          });
          hls.on(Hls.Events.ERROR, (e, data) => {
            if (data.fatal) {
              nowPlayingText.textContent = 'Stream unavailable. Try another.';
              setPlaybackState(false);
            }
          });
        } else {
          audio.src = station.streamUrl;
          const playPromise = audio.play();
          if (playPromise !== undefined) {
            playPromise
              .then(() => updateMediaSession(station))
              .catch(handleError);
          }
        }
      }

      function handleError(err) {
        if (err.name === 'AbortError') return;
        nowPlayingText.textContent = 'Stream unavailable. Try another.';
        setPlaybackState(false);
      }

      function togglePlay(stationId) {
        const station = stations.find(s => s.id === stationId);
        if (!station) return;
        
        if (currentStation && currentStation.id === stationId) {
          if (audio.paused) {
            audio.play().catch(handleError);
          } else {
            audio.pause();
          }
        } else {
          playStation(station);
        }
      }

      function changeStation(direction) {
        const currentIndex = currentStation ? stations.findIndex(s => s.id === currentStation.id) : 0;
        let targetIndex = currentIndex + direction;
        
        if (targetIndex >= stations.length) targetIndex = 0;
        if (targetIndex < 0) targetIndex = stations.length - 1;

        playStation(stations[targetIndex]);
      }

      audio.addEventListener('playing', () => {
        setPlaybackState(true);
        nowPlayingText.textContent = currentStation.name;
      });

      audio.addEventListener('pause', () => {
        setPlaybackState(false);
        nowPlayingText.textContent = `Paused (${currentStation ? currentStation.name : ''})`;
      });

      audio.addEventListener('waiting', () => {
        nowPlayingText.textContent = 'Buffering...';
      });

      // WHOLE CARD CLICK EVENT: Detects taps anywhere on the card
      stationsContainer.addEventListener('click', (e) => {
        const card = e.target.closest('.station-card');
        if (card) {
          const id = card.getAttribute('data-id');
          if (id) togglePlay(id);
        }
      });

      nextBtn.addEventListener('click', () => changeStation(1));
      prevBtn.addEventListener('click', () => changeStation(-1));

      function updatePlayButton(stationId, isPlaying) {
        const button = document.querySelector(`.play-btn[data-btn-id="${stationId}"]`);
        if (!button) return;
        const icon = button.querySelector('i');
        if (isPlaying) {
          button.classList.add('playing');
          icon.className = 'fas fa-pause';
        } else {
          button.classList.remove('playing');
          icon.className = 'fas fa-play';
        }
      }

      function highlightPlayingStation(stationId) {
        document.querySelectorAll('.station-card').forEach(card => card.classList.remove('playing'));
        const activeCard = document.getElementById(`station-${stationId}`);
        if (activeCard) activeCard.classList.add('playing');
      }
    });
  </script>
</body>
</html>
